name: CI and CD - Modelo de Cáncer

on:
  push:
    branches:
      - main

jobs:
  retraining_model:
    runs-on: ubuntu-latest
    container: docker://dvcorg/cml:latest
    env:
      repo_token: ${{ secrets.GITHUBTOKEN }}
    steps:
      - uses: actions/checkout@v2

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install requirements
        run: |
          pip3 install -r model/requirements.txt

      - name: Ejecutar entrenamiento
        run: |
          python3 model/retraining.py

      - name: Generar reporte de métricas
        run: |
          echo "## Métricas del modelo" > report.md
          cat model/metrics.txt >> report.md

          echo "## Visualización" >> report.md
          cml-publish model/feature_importance.png --md >> report.md
          
          cml-send-comment report.md

  build_docker_image:
    needs: retraining_model
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repo
        uses: actions/checkout@v2

      - name: Login a DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build imagen Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/breast-cancer-mlops-tarea4:v1 model/

      - name: Subir imagen a DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/breast-cancer-mlops-tarea4:v1
